name: Market Alarm

on:
  workflow_dispatch:
    inputs:
      task:
        description: "실행 작업"
        required: true
        default: "all"
        type: choice
        options: [all, finra, korea, us, crypto, month-end, monthly]
      force_alert:
        description: "상태가 같아도 Telegram 전송"
        required: false
        default: true
        type: boolean
  schedule:
    # GitHub cron은 UTC. KST = UTC+9.
    # 정각 부근은 GitHub Actions 예약 실행이 지연/누락되기 쉬워 피한다.
    # 일상적인 보완 실행은 두지 않는다. API 일시 오류는 실행 내부 재시도로
    # 처리하고, 러너 미배정은 다음 정규 실행에서 자연스럽게 보완한다.
    - cron: "37 9 * * 1-5"           # 평일 18:37 KST: 한국
    - cron: "17 23 * * *"            # 매일 08:17 KST: 미국
    - cron: "23 9,21 * * *"          # 매일 06:23/18:23 KST: 코인
    - cron: "27 6 15,18,21,24 * *"   # 매월 15/18/21/24일 15:27 KST: FINRA
    - cron: "47 0 1 * *"             # 매월 1일 09:47 KST: 전월 월말판정
    - cron: "27 3 1 * *"             # 매월 1일 12:27 KST: 월간보고

permissions:
  contents: write

concurrency:
  group: market-alarm-database
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FREESIS_DOWNLOAD_URL: ${{ secrets.FREESIS_DOWNLOAD_URL }}
      FREESIS_DOWNLOAD_METHOD: ${{ vars.FREESIS_DOWNLOAD_METHOD }}
      FREESIS_DOWNLOAD_PAYLOAD_JSON: ${{ secrets.FREESIS_DOWNLOAD_PAYLOAD_JSON }}
      FREESIS_USE_PLAYWRIGHT: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify repository layout
        shell: bash
        run: |
          test -f pyproject.toml || {
            echo "::error::pyproject.toml이 저장소 최상단에 없습니다. ZIP 안쪽의 market-alarm 폴더가 아니라 그 안의 파일들을 최상단에 올려야 합니다."
            exit 1
          }
          test -f src/market_alarm/cli.py || {
            echo "::error::src/market_alarm/cli.py가 없습니다. 저장소 폴더 구조가 잘못되었습니다."
            exit 1
          }
          test -f .github/workflows/monitor.yml || {
            echo "::error::.github/workflows/monitor.yml이 없습니다."
            exit 1
          }
          echo "Repository layout: OK"

      - name: Select task
        id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            task="${{ inputs.task }}"
          else
            case "${{ github.event.schedule }}" in
              # GitHub may keep an event queued under an older cron after this
              # workflow file is updated, then execute it against the newest
              # file. Keep prior cron values as aliases so those delayed events
              # still select the intended task instead of failing as unknown.
              "30 9 * * 1-5"|"37 9 * * 1-5"|"17 11 * * 1-5") task="korea" ;;
              "0 23 * * *"|"17 23 * * *"|"47 0 * * *") task="us" ;;
              "5 3,7,11,15,19,23 * * *"|"23 3,7,11,15,19,23 * * *"|"23 3,9,15,21 * * *"|"23 9,21 * * *") task="crypto" ;;
              "0 6 15-25 * *"|"27 6 15-25 * *"|"27 6 15,18,21,24 * *") task="finra" ;;
              "50 14 28-31 * *"|"47 13 28-31 * *"|"47 14 28-31 * *"|"47 0 1 * *") task="month-end" ;;
              "0 0 1 * *"|"27 0 1 * *"|"27 3 1 * *") task="monthly" ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Check configuration and Secrets
        run: market-alarm doctor --strict

      - name: Test Telegram connection
        if: github.event_name == 'workflow_dispatch'
        run: market-alarm test-telegram

      - name: Run monitor
        id: monitor
        shell: bash
        run: |
          force=""
          if [[ "${{ inputs.force_alert }}" == "true" ]]; then force="--force-alert"; fi
          result="$(market-alarm run "${{ steps.select.outputs.task }}" $force)"
          echo "$result"
          {
            echo "## Market Alarm 실행 결과"
            echo
            echo "- 버전: v1.8.0"
            echo "- 작업: ${{ steps.select.outputs.task }}"
            echo "- 강제 알림: ${{ inputs.force_alert || false }}"
            echo
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist public market data and state
        shell: bash
        run: |
          set -euo pipefail
          task="${{ steps.select.outputs.task }}"
          db="data/market_alarm.sqlite3"
          git config user.name "market-alarm-bot"
          git config user.email "market-alarm-bot@users.noreply.github.com"

          git add "$db"
          if git diff --cached --quiet; then
            echo "No database changes"
            exit 0
          fi

          # $db is a binary SQLite file, so git cannot merge it.  The old flow was
          # "commit -> pull --rebase -> push", which meant any push to main while
          # this job ran (another task's data commit, or a manual file upload)
          # turned into "CONFLICT (content): Merge conflict in data/..." and
          # failed the job *after* the data had already been collected.
          #
          # Never rebase the DB.  Replay it onto the newest main instead: take the
          # freshly written file, reset to origin, put the file back, push.  If
          # someone pushes again mid-loop, retry rather than fail.
          cp "$db" "${RUNNER_TEMP}/market_alarm.sqlite3"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "${RUNNER_TEMP}/market_alarm.sqlite3" "$db"
            git add "$db"

            if git diff --cached --quiet; then
              echo "No database changes after syncing with origin"
              exit 0
            fi

            git commit -m "data: update ${task} [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Database pushed on attempt ${attempt}"
              exit 0
            fi

            echo "Push raced with another commit; retrying (${attempt}/5)"
            sleep $((attempt * 5))
          done

          echo "::error::데이터는 수집됐지만 5회 시도에도 push하지 못했습니다."
          exit 1
