    AMZN:  {name: "Amazon", exchange: NAS, buy_ma200_gap: -25, sell_ma120_warning: 25, sell_ma120_strong: 30}
    NVDA:  {name: "NVIDIA", exchange: NAS, buy_ma200_gap: -30, sell_ma120_warning: 35, sell_ma120_strong: 40}
    AVGO:  {name: "Broadcom", exchange: NAS, buy_ma200_gap: -30, sell_ma120_warning: 35, sell_ma120_strong: 40}
    TSM:   {name: "TSMC", exchange: NYS, buy_ma200_gap: -30, sell_ma120_warning: 35, sell_ma120_strong: 40}
    ASML:  {name: "ASML", exchange: NAS, buy_ma200_gap: -30, sell_ma120_warning: 35, sell_ma120_strong: 40}
    LRCX:  {name: "Lam Research", exchange: NAS, buy_ma200_gap: -30, sell_ma120_warning: 35, sell_ma120_strong: 40}
    KLAC:  {name: "KLA", exchange: NAS, buy_ma200_gap: -30, sell_ma120_warning: 35, sell_ma120_strong: 40}

