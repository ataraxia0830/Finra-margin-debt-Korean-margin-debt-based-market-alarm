timezone: Asia/Seoul
database: data/market_alarm.sqlite3

http:
  timeout_seconds: 30
  retries: 3
  user_agent: "market-alarm/1.0 (+personal research monitor)"

finra:
  page_url: "https://www.finra.org/rules-guidance/key-topics/margin-accounts/margin-statistics"
  excel_url: "https://www.finra.org/sites/default/files/2021-03/margin-statistics.xlsx"
  overheat_yoy: 50
  lookback_months: 48
  sideways_buy_warning_yoy: -10
  sideways_buy_strong_yoy: -15
  buy_warning_yoy: -25
  buy_strong_yoy: -30
  balance_drawdown_alert_levels: [-20, -25, -30]
  sell_warning_relative_drop: -10
  sell_strong_relative_drop: -15

freesis:
  page_url: "https://freesis.kofia.or.kr/stat/FreeSIS.do?parentDivId=MSIS10000000000000&serviceId=STATSCU0100000070"
  api_base_url: "https://freesis.kofia.or.kr"
  history_start_month: "201001"
  bootstrap_files:
    - "bootstrap/freesis_credit.csv"
    - "bootstrap/freesis_credit.xlsx"
  overheat_yoy: 60
  # 직전 고점(선행 최고 YoY)을 찾는 창.  FINRA와 동일하게 48개월을 쓴다.
  lookback_months: 48
  buy_warning_yoy: -25
  buy_strong_yoy: -30
  balance_drawdown_min: -30
  sell_relative_drop: -15
  prior_crash_cutoff: -45
  prior_crash_lookback_months: 18

